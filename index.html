<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>笑顔トレーナー</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 24px 16px 50px;
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans",
        "Yu Gothic", sans-serif;
      background: #fffaf2;
      color: #222;
      text-align: center;
    }

    .container {
      max-width: 520px;
      margin: auto;
    }

    h1 {
      margin-bottom: 6px;
      font-size: 32px;
    }

    .subtitle {
      color: #666;
      margin-bottom: 20px;
    }

    #startButton {
      width: 100%;
      max-width: 320px;
      padding: 16px;
      border: none;
      border-radius: 14px;
      font-size: 20px;
      font-weight: bold;
      background: #222;
      color: white;
      cursor: pointer;
    }

    .camera-box {
      position: relative;
      margin: 20px auto;
      width: 100%;
      max-width: 480px;
      overflow: hidden;
      border-radius: 20px;
      background: #111;
    }

    video {
      display: block;
      width: 100%;
      transform: scaleX(-1);
    }

    .score-card {
      background: white;
      border-radius: 20px;
      padding: 20px;
      margin-top: 18px;
      box-shadow: 0 3px 18px rgba(0,0,0,0.08);
    }

    #score {
      font-size: 64px;
      line-height: 1;
      font-weight: 800;
      margin: 10px 0;
    }

    #rank {
      font-size: 26px;
      font-weight: bold;
      margin-bottom: 18px;
    }

    .meter {
      text-align: left;
      margin: 14px 0;
    }

    .meter-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 6px;
      font-weight: bold;
    }

    .bar-bg {
      width: 100%;
      height: 12px;
      border-radius: 10px;
      background: #eee;
      overflow: hidden;
    }

    .bar {
      height: 100%;
      width: 0%;
      border-radius: 10px;
      background: #333;
      transition: width 0.15s;
    }

    #advice {
      margin-top: 20px;
      padding: 14px;
      background: #f5f5f5;
      border-radius: 12px;
      line-height: 1.6;
      font-weight: bold;
    }

    #status {
      margin-top: 12px;
      color: #666;
      font-size: 14px;
    }

    .note {
      font-size: 12px;
      color: #888;
      margin-top: 20px;
      line-height: 1.5;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>😊 笑顔トレーナー</h1>
  <div class="subtitle">
    接客にぴったりの笑顔を練習しよう
  </div>

  <button id="startButton">カメラを起動</button>

  <div class="camera-box">
    <video id="video" autoplay playsinline muted></video>
  </div>

  <div class="score-card">

    <div>笑顔レベル</div>

    <div id="score">--</div>

    <div id="rank">カメラを起動してください</div>

    <div class="meter">
      <div class="meter-row">
        <span>😊 口角</span>
        <span id="mouthValue">--</span>
      </div>
      <div class="bar-bg">
        <div id="mouthBar" class="bar"></div>
      </div>
    </div>

    <div class="meter">
      <div class="meter-row">
        <span>👀 目元</span>
        <span id="eyeValue">--</span>
      </div>
      <div class="bar-bg">
        <div id="eyeBar" class="bar"></div>
      </div>
    </div>

    <div
